# ============================================================================
# nginx-salaryticker.conf —— SalaryTicker 官网 + 下载站
#
# 部署：
#   sudo cp nginx-salaryticker.conf /etc/nginx/sites-available/salaryticker
#   sudo ln -sf /etc/nginx/sites-available/salaryticker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 目录结构（由 tools/deploy.ps1 自动维护 download/ 与 version.json）：
#   /var/www/salaryticker/
#   ├── index.html              官网
#   ├── assets/                 图标（favicon / Logo）
#   ├── version.json            版本清单（应用启动时拉取判断更新）
#   └── download/
#       ├── SalaryTicker.exe -> releases/SalaryTicker-<版本>.exe   简洁下载路径
#       └── releases/           带版本号的归档
# ============================================================================

# HTTP 自动跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name salaryticker.leelab.com.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name salaryticker.leelab.com.cn;

    ssl_certificate     /etc/nginx/ssl/salaryticker.leelab.com.cn/salaryticker.leelab.com.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/salaryticker.leelab.com.cn/salaryticker.leelab.com.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/salaryticker;
    index index.html;

    # ── 版本清单：必须禁用缓存 ────────────────────────────────────────
    # （否则应用和官网会拿到旧清单，导致"有新版本却检测不到"）
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        default_type application/json;
        try_files $uri =404;
    }

    # ── 官网页面：禁用缓存，保证老用户第二次访问也是最新版 ────────────
    # 页面只有 30 多 KB，内容随发版变化；不显式设置的话浏览器会"启发式缓存"
    # （按文件修改时间估算，可能几小时内都拿旧版），所以这里必须 no-store
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # ── 简洁下载路径：/download/SalaryTicker.exe ──────────────────────
    # 软链由 deploy.ps1 指向 releases/ 下最新归档；Content-Disposition 保证
    # 即使用户直接点链接也能得到正确文件名
    location = /download/SalaryTicker.exe {
        add_header Content-Disposition "attachment; filename=SalaryTicker.exe";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # ── 历史版本列表：以 JSON 返回目录清单，供官网渲染成列表 ──────────
    # 官网「查看历史版本」按钮会 fetch 这个地址
    location /download/releases/ {
        autoindex on;
        autoindex_format json;      # 返回 JSON 而非 nginx 默认的朴素 HTML 目录页
        autoindex_localtime on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── 版本归档：/download/releases/SalaryTicker-1.1.0.exe ───────────
    # 注意：这里**不要**设置 Content-Disposition，否则历史版本会被浏览器
    #       统一命名成 SalaryTicker.exe，用户分不清下载的是哪一版
    location /download/ {
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    # ── 静态资源（图标等）────────────────────────────────────────────
    # no-cache = 允许存但每次都向服务器校验：换了图标立刻生效，
    #            没换则返回 304（几十字节），比完全不缓存更省流量
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache" always;
        access_log off;
        try_files $uri =404;
    }

    # ── 日志与加固 ───────────────────────────────────────────────────
    server_tokens off;
    access_log /var/log/nginx/salaryticker.access.log;
    error_log  /var/log/nginx/salaryticker.error.log;
}
